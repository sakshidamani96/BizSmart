# =============================================================================
# Render Blueprint for BizSmart
#   Dashboard -> New -> Blueprint -> pick this repo. Render creates:
#     1. bizsmart-db   : managed PostgreSQL (free)
#     2. bizsmart      : Docker web service serving the React UI + Spring Boot API
# Docs: https://render.com/docs/blueprint-spec
# =============================================================================
databases:
  - name: bizsmart-db
    plan: free
    region: singapore        # keep the DB and the service in the same region
    databaseName: bizsmartdb
    user: bizsmart
    ipAllowList: []          # only services inside Render can connect

services:
  - type: web
    name: bizsmart
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./BizSmart/Dockerfile
    dockerContext: ./BizSmart
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Database connection parts from the managed instance (internal network)
      - key: DB_HOST
        fromDatabase:
          name: bizsmart-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bizsmart-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: bizsmart-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: bizsmart-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bizsmart-db
          property: password
      # Random 256-bit signing key generated once by Render
      - key: JWT_SECRET
        generateValue: true
      # Creates/updates tables from the JPA entities on startup
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      # Demo accounts & sample catalogue on first boot. Set to "false" for a real store,
      # and set DEMO_USER_PASSWORD (Dashboard -> Environment) before the first deploy.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_USER_PASSWORD
        sync: false
      # Anyone can register a store-owner account. Set "false" once your own account exists.
      - key: PUBLIC_SIGNUP_ENABLED
        value: "true"
      # UI and API share one origin, so CORS is only needed for other front-ends
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
